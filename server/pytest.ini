[pytest]
# `asyncio_mode = auto` не ставим нарочно: явный маркер показывает, какие тесты
# гоняют event loop, а какие проверяют чистые функции.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    resolver_error(error): подсунуть фикстуре `client` резолвер, который кидает этот отказ
    rate_limit(limit): поднять сервер с этим пределом запросов в минуту
    discord_down: поднять сервер, у которого Discord не отвечает
filterwarnings =
    default
    # aiohttp советует web.AppKey вместо строковых ключей. Здесь ключи читаются
    # из middleware и тестов по имени, типизация приложения ничего не добавит, а
    # предупреждение на каждый ключ прячет настоящие.
    ignore::aiohttp.web_app.NotAppKeyWarning
